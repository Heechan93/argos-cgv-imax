name: ARGOS CGV IMAX monitor

# 감시는 Cloudflare Worker(1분 간격, 영등포)로 이관했다.
# GitHub의 예약 실행은 5분 크론을 걸어도 실제로는 ~1시간까지 밀려서
# 오픈 시각을 분 단위로 잡을 수 없었다. 여기서는 수동 실행만 남긴다.
on:
  workflow_dispatch:
    inputs:
      ping:
        description: "설정 확인 핑을 텔레그램으로 전송"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cgv-imax-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: CGV 좌석 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGOS_PING: ${{ inputs.ping == true && '1' || '' }}
        run: python3 monitor.py

      - name: 상태 저장
        run: |
          git add -A
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "argos-bot"
            git config user.email "actions@github.com"
            git commit -m "state: 잔여석 기록 갱신"
            git pull --rebase origin main
            git push
          fi
