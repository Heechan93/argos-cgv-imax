name: ARGOS 영등포 IMAX 1분 감시

# GitHub의 예약 실행은 5분 크론을 걸어도 실제로는 최대 1시간까지 밀린다.
# 그래서 '자주 실행'하는 대신, 한 번 뜬 잡이 150분간 상주하며 1분 간격으로 감시한다.
# 15분 크론으로 발화 기회를 늘리고, concurrency 큐가 "실행 1 + 대기 1"을 유지해
# 현재 잡이 끝나는 즉시 대기 중이던 잡이 이어받는다(이어달리기).
# 공개 저장소라 Actions 실행 시간은 무료·무제한이다.
on:
  schedule:
    # GitHub은 예약을 최대 1시간 이상 미룬다. 슬롯을 촘촘히 두어 발화 기회를 늘리고,
    # 아래 concurrency 큐가 "실행 1 + 대기 1"만 남겨 이어달리기하도록 한다.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "감시 지속 시간(분)"
        type: string
        default: "150"
      dry_run:
        description: "리허설: 알림을 실제로 보내지 않고 문구만 로그에 출력"
        type: boolean
        default: false
      force_horizon:
        description: "리허설용 기준선 강제 (YYYYMMDD)"
        type: string
        default: ""

permissions:
  contents: write

# 같은 그룹으로 묶어 "실행 1 + 대기 1"만 유지한다. 취소하지 않으므로
# 현재 잡 종료 즉시 대기 잡이 시작돼 공백이 사라지고, 중복 알림도 없다.
concurrency:
  group: cgv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4

      - name: 영등포 IMAX 감시 (1분 간격 상주)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES: ${{ inputs.minutes || '150' }}
          ARGOS_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          ARGOS_FORCE_HORIZON: ${{ inputs.force_horizon }}
        run: python3 monitor.py

      - name: 기준선·오픈이력 저장
        if: always()
        run: |
          git add state.json openings.log
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "argos-bot"
            git config user.email "actions@github.com"
            git commit -m "state: 기준선/오픈이력 갱신"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
