name: 네이버 예매 접근 조사
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 네이버 예매 최종 랜딩 확인
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          for u in "https://m.booking.naver.com/movie/" "https://booking.naver.com/movie/"; do
            echo "=== $u"
            curl -s -L --max-time 25 -A "$UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: ko-KR,ko;q=0.9,en;q=0.8" \
              "$u" -o p.html -w "  최종URL=%{url_effective} http=%{http_code} size=%{size_download}\n"
            echo "  --- 본문 키워드 ---"
            for kw in 오디세이 IMAX 아이맥스 영등포 상영 예매 로그인; do
              c=$(grep -o "$kw" p.html 2>/dev/null | wc -l); [ "$c" -gt 0 ] && echo "    $kw: ${c}회"
            done
            echo "  --- 내부 링크 ---"
            grep -oE 'href="[^"]{5,80}"' p.html 2>/dev/null | sort -u | head -12
          done
