name: 네이버 예매 접근 조사

# 네이버 예매가 CGV 본 사이트보다 늦게 열리는지 확인하기 위한 일회성 조사.
# 로컬 환경에서는 네이버 도메인이 전부 차단돼 있어 러너에서 확인한다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 네이버 도메인 접근 확인
        run: |
          for h in www.naver.com search.naver.com m.movie.naver.com movie.naver.com m.booking.naver.com; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36" "https://$h/" || echo "FAIL")
            echo "$h -> $code"
          done

      - name: 네이버 상영시간표 조회 시도
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          Q=$(printf 'CGV영등포타임스퀘어 상영시간표' | jq -sRr @uri)
          echo "=== search.naver.com ==="
          curl -s --max-time 20 -A "$UA" "https://search.naver.com/search.naver?where=nexearch&query=$Q" -o s.html -w "http=%{http_code} size=%{size_download}\n" || true
          for kw in 오디세이 IMAX 아이맥스 예매 상영시간; do
            echo "  '$kw' 등장: $(grep -o "$kw" s.html 2>/dev/null | wc -l)회"
          done
          echo "--- 날짜 후보 ---"
          grep -oE '2026[.-]?0?9[.-]?0?[1-9]' s.html 2>/dev/null | sort -u | head -10 || echo "없음"
          grep -oE '(08|8)\.(2[0-9]|3[01])' s.html 2>/dev/null | sort -u | head -10 || echo "없음"

      - name: 네이버 영화 API 후보 확인
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1"
          for u in \
            "https://m.movie.naver.com/movie/bi/mi/basic.naver?code=" \
            "https://movie.naver.com/movie/bi/mi/basic.naver?code=" \
            "https://m.booking.naver.com/movie/" ; do
            echo "--- $u"
            curl -s -o /dev/null --max-time 15 -A "$UA" -w "  http=%{http_code} redirect=%{redirect_url}\n" -L "$u" || echo "  실패"
          done
